<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ColisTrack | Livraisons</title>

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="../assets/css/styles.css">
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════════════
     Barre de navigation
══════════════════════════════════════════════════════════════════════ -->
<header class="app-header">

    <a href="dashboard.html" class="brand">🚚 Colis<span>Track</span></a>

    <nav>
        <a href="dashboard.html">
            <i class="bi bi-speedometer2"></i> Tableau de bord
        </a>
        <a href="livraisons.html" class="active">
            <i class="bi bi-box-seam"></i> Livraisons
        </a>
        <a href="coursiers.html" class="admin-seulement">
            <i class="bi bi-people"></i> Coursiers
        </a>
         <a href="salaires.html" class="admin-seulement">
            <i class="bi bi-cash-coin"></i> Salaires
        </a>
    </nav>

    <div class="d-flex align-items-center gap-3">
        <span style="color: rgba(255,255,255,0.65); font-size: 0.875rem;">
            <i class="bi bi-person-circle me-1"></i>
            <span id="nom-utilisateur"></span>
        </span>
        <button class="logout-btn" onclick="deconnecter()">
            <i class="bi bi-box-arrow-right me-1"></i>Déconnexion
        </button>
    </div>

</header>

<!-- ══════════════════════════════════════════════════════════════════════
     Contenu principal
══════════════════════════════════════════════════════════════════════ -->
<main class="page-content">

    <!-- ── En-tête de page ─────────────────────────────────────────── -->
    <div class="page-header">
        <h2>Gestion des Livraisons</h2>
        <button class="btn btn-primary admin-seulement" id="btn-nouvelle">
            <i class="bi bi-plus-lg me-1"></i>Nouvelle livraison
        </button>
    </div>

    <!-- ── Barre de filtres ─────────────────────────────────────────── -->
    <div class="mb-4"
         style="background: var(--white); border-radius: var(--radius);
                padding: 1.25rem 1.5rem; box-shadow: var(--shadow-sm);">

        <div class="d-flex gap-3 flex-wrap align-items-end">

            <!-- Mois -->
            <div>
                <label class="form-label mb-1" style="font-size: 0.8125rem; font-weight: 600; color: var(--gray-700);">
                    Mois
                </label>
                <input type="month" id="filter-month" class="form-control"
                       style="min-width: 160px;">
            </div>

            <!-- Coursier (admins seulement) -->
            <div class="admin-seulement">
                <label class="form-label mb-1" style="font-size: 0.8125rem; font-weight: 600; color: var(--gray-700);">
                    Coursier
                </label>
                <select id="filter-coursier" class="form-select" style="min-width: 210px;">
                    <option value="">Tous les coursiers</option>
                    <!-- rempli par livraisons.js -->
                </select>
            </div>

            <!-- Statut -->
            <div>
                <label class="form-label mb-1" style="font-size: 0.8125rem; font-weight: 600; color: var(--gray-700);">
                    Statut
                </label>
                <select id="filter-statut" class="form-select" style="min-width: 170px;">
                    <option value="">Tous les statuts</option>
                    <option value="Livré">Livré</option>
                    <option value="En attente">En attente</option>
                    <option value="Retourné">Retourné</option>
                </select>
            </div>

            <!-- Actions de filtre -->
            <div class="d-flex gap-2">
                <button class="btn btn-primary" id="btn-filter">
                    <i class="bi bi-funnel me-1"></i>Filtrer
                </button>
                <button class="btn btn-outline" id="btn-reset">
                    <i class="bi bi-arrow-counterclockwise me-1"></i>Réinitialiser
                </button>
            </div>

        </div>
    </div>

    <!-- ── Tableau des livraisons ───────────────────────────────────── -->
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th style="width: 130px;">Référence</th>
                    <th>Coursier</th>
                    <th>Date</th>
                    <th>Nombre de colis</th>
                    <th>Statut</th>
                    <th class="admin-seulement" style="width: 110px;">Actions</th>
                </tr>
            </thead>
            <tbody id="livraisons-body">
                <!-- rempli par livraisons.js -->
            </tbody>
        </table>
    </div>

</main>

<!-- ══════════════════════════════════════════════════════════════════════
     Modal — Ajouter / Modifier une livraison
══════════════════════════════════════════════════════════════════════ -->
<div class="modal fade" id="modal-livraison" tabindex="-1"
     aria-labelledby="modal-titre" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content" style="border: none; border-radius: var(--radius); overflow: hidden;">

            <!-- En-tête -->
            <div class="modal-header" style="background: var(--navy-900); border-bottom: none;">
                <h5 class="modal-title text-white fw-bold" id="modal-titre">
                    Nouvelle livraison
                </h5>
                <button type="button" class="btn-close btn-close-white"
                        data-bs-dismiss="modal" aria-label="Fermer"></button>
            </div>

            <!-- Corps -->
            <div class="modal-body p-4">
                <form id="form-livraison" novalidate>

                    <!-- Champ caché — id de la livraison (vide = mode ajout) -->
                    <input type="hidden" id="livraison-id">

                    <!-- Coursier -->
                    <div class="form-group">
                        <label for="livraison-coursier">Coursier</label>
                        <select id="livraison-coursier" class="form-select" required>
                            <option value="" disabled selected>Sélectionner un coursier</option>
                            <!-- rempli par livraisons.js -->
                        </select>
                        <div class="invalid-feedback">
                            Veuillez sélectionner un coursier.
                        </div>
                    </div>

                    <!-- Date -->
                    <div class="form-group">
                        <label for="livraison-date">Date de livraison</label>
                        <input type="date" id="livraison-date" class="form-control" required>
                        <div class="invalid-feedback">
                            La date est requise.
                        </div>
                    </div>

                    <!-- Nombre de colis -->
                    <div class="form-group">
                        <label for="livraison-colis">Nombre de colis</label>
                        <input type="number" id="livraison-colis" class="form-control"
                               min="0" placeholder="Ex : 10" required>
                        <div class="invalid-feedback">
                            Le nombre de colis est requis (minimum 0).
                        </div>
                    </div>

                    <!-- Statut -->
                    <div class="form-group mb-0">
                        <label for="livraison-statut">Statut</label>
                        <select id="livraison-statut" class="form-select">
                            <option value="Livré">Livré</option>
                            <option value="En attente">En attente</option>
                            <option value="Retourné">Retourné</option>
                        </select>
                    </div>

                </form>
            </div>

            <!-- Pied de page -->
            <div class="modal-footer" style="border-top: 1px solid var(--gray-200);">
                <button type="button" class="btn btn-outline" data-bs-dismiss="modal">
                    Annuler
                </button>
                <button type="button" class="btn btn-primary" id="btn-save">
                    <i class="bi bi-check2 me-1"></i>Enregistrer
                </button>
            </div>

        </div>
    </div>
</div>

<!-- ── Scripts ──────────────────────────────────────────────────────────── -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../scripts/session.js"></script>
<script src="../scripts/db.js"></script>
<script src="../scripts/livraisons.js"></script>

</body>
</html>
